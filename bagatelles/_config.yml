# Book settings
title: Bagatelles
author: Johannes Siedersleben
copyright: "2026, Johannes Siedersleben"
logo: pict-03.png

# Force re-execution of notebooks on each build.
exclude_patterns:
  - mathematics/pontryagin.md
  - mathematics/tangent-cotangent.md
  # improve.py artifacts: tracked in git, but not built/published
  - "**/*-plan.md"
  - "**/*-backup.md"
  - "**/*-comments.md"

execute:
  execute_notebooks: off  # Use pre-executed outputs from notebooks

# Parse MyST markdown in notebooks
parse:
  myst_enable_extensions:
    - amsmath
    - colon_fence
    - dollarmath
    - linkify
    - substitution
    - tasklist
  myst_url_schemes: [mailto, http, https]

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: bagatelles.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib
  - israel/references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/johsieders/essays
  path_to_book: bagatelles
  branch: main

# Add GitHub buttons to your book
html:
  use_issues_button: true
  use_repository_button: true
  use_edit_page_button: true

# Sphinx configuration
sphinx:
  extra_extensions:
    - sphinx_proof
    - sphinx_togglebutton
  config:
    html_theme: sphinx_book_theme
    html_theme_options:
      repository_url: https://github.com/johsieders/essays
      use_repository_button: true
      use_issues_button: true
      use_edit_page_button: true
      home_page_in_toc: true
      show_navbar_depth: 1
      navigation_with_keys: true
      show_prev_next: true
    bibtex_reference_style: author_year
    # proof_theorem_title: name
    html_static_path:
      - _static
    html_css_files:
      - custom.css
    mathjax3_config:
      chtml:
        displayAlign: 'left'
        displayIndent: '2em'
    # Toggle button configuration for hiding code
    togglebutton_hint: "Click to show code"
    togglebutton_hint_hide: "Click to hide code"
